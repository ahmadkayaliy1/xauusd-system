# Automated Trading System — main configuration (no secrets here; secrets go in .env).
# D-051: THIS folder is the XAUUSD system only — its own code, data, logs, tasks and settings; it shares
# no file with the other pairs' folders (C:\TradingSystems\<PAIR>).
# Local overrides: config/config.local.yaml (git-ignored, deep-merged over this file).
# One-line switches via .env: ACTIVE_AI_PROVIDER, AGENT_MODE, TRIGGER_POLICY,
# EXECUTION_MODE, EXECUTION_TRIGGER, RESOURCE_PROFILE, <PROVIDER>_MODEL.

profile: standard            # low (4 GB RAM PCs) | standard

timeframes: [1m, 5m, 15m, 1h, 4h, 1d, 1w]   # D-010, confirmed/adjusted in P6.15

paths:
  data_dir: data
  logs_dir: logs

storage:                             # D-020: SQLite hot window, then daily Parquet (zstd) cold archive
  hot_days: {agg_trades: 2, ticks: 3, book_ticker: 2, liquidations: 30, depth: 30}
  rollover_grace_hours: 2
  min_free_disk_gb: 10
  cold_archive_min_free_gb: 2        # the live writers' daily cold rollover waits below this (the hot store keeps the rows)

logging:
  level: INFO
  max_bytes: 20971520
  backups: 10
  console: true

supervisor:                          # `run all` (P5.1/P5.3) — docs/ops_windows.md
  keep_awake: true                   # block idle sleep while running (lid close / power button = Windows setting)
  manage_mt5_terminal: true          # start a missing MT5 terminal outside the supervisor's job/tree (OPS-04)
  mt5_task: TradingSystem-MT5        # scheduled task used for that when registered (scripts/install_autostart.ps1)
  task_folder: '\TradingSystems\XAUUSD\'   # D-051: this system's own Task Scheduler folder (every task of it)
  child_log_max_bytes: 5242880       # logs/<service>.stderr.log (child stdout/stderr) rolled at (re)start above this
  child_log_backups: 2

resources:                           # SQLite page cache per store and the Vision CSV parse block (P5.2)
  low:
    sqlite_cache_mb: 8
    parse_chunk_rows: 200000
  standard:
    sqlite_cache_mb: 16
    parse_chunk_rows: 500000

mt5:
  data_profile: demo                 # terminal/account feeding MT5 ingestion
  execution_profile_by_mode: {demo: demo, live: live}
  poll_interval_ms: 100              # provisional; measured in P1.8
  call_timeout_s: 10
  profiles:
    demo:
      terminal_path: "C:/Program Files/MetaTrader 5/terminal64.exe"
      server: WindsorBrokers1-Demo
      account_type: demo
      login_env: MT5_DEMO_LOGIN      # optional: empty = attach to the already logged-in terminal
      password_env: MT5_DEMO_PASSWORD
    live:
      terminal_path: "C:/MT5_Live/terminal64.exe"   # separate portable terminal (plan item 7)
      server: WindsorBrokers1-Real1
      account_type: real
      login_env: MT5_LIVE_LOGIN
      password_env: MT5_LIVE_PASSWORD

binance:
  spot_rest: https://api.binance.com
  spot_ws: wss://stream.binance.com:9443
  usdm_rest: https://fapi.binance.com
  usdm_ws: wss://fstream.binance.com
  vision: https://data.binance.vision
  api_key_env: BINANCE_API_KEY       # only needed if Binance execution is ever enabled (D-002)
  api_secret_env: BINANCE_API_SECRET
  rest_weight_budget_per_min: 1000   # D-051: was 3000 shared out by the three systems (one IP) = 1000 each

# Logical pairs -> venue instruments with roles (D-008).
# start: per datatype — ISO date (UTC), relative ("-365d"), or "earliest" (as far as the source allows).
pairs:
  XAUUSD:
    asset_class: metal
    decision_timeframe: 15m
    pip_size: 0.1
    footprint_bucket: 0.5
    flow_proxy_approved: false       # XAUUSDT perp order flow as proxy — only after the P1.11 study approves it
    desk:                            # D-052 (owner, 2026-10-01): gold TRADES on the demo account through the full gate
      mode: live                     # (was shadow, D-049). Rollback: mode: shadow, brief: desks/xau, the two windows
      brief: desks/xau_live          # (london 07:45-11:00 Europe/London, new_york 08:15-11:30 America/New_York),
      windows: []                    # friday_cutoff 12:00, no flat_before_weekend - then restart_all.bat.
      reopen_grace_min: 60           # [] = entry calls all day, Asia included (the model reads the session)
      friday_cutoff: {time: "15:00", tz: America/New_York}            # no new entry after it on Friday
      flat_before_weekend: {time: "16:30", tz: America/New_York}      # every open trade closed, orders cancelled
      management: model              # D-054 (owner, 2026-10-07): back to the model's management (be_2r lost in August)
      journal: true                  # D-055 (owner, 2026-10-09): the trade journal + trade_review in every payload
      sl_moves: profit_only          # D-055: a stop moves only to breakeven or into profit
      sl_move_min_r: 1.5             # D-055: and not before the trade's best move reached 1.5 R (H)
      view_cadence: every_5m_holding # D-056 (2026-10-11): a look every 5 min while a trade / pending order is held
                                     # (3 unseen days: +25.28 vs H -18.65, better on 2 of 3); flat = triggers as before
      holiday_flats:                 # the same flat before a US holiday halt / early close / closure (the session calendar
        - {date: "2026-11-26", time: "12:00", tz: America/New_York}   # knows no holidays). Conservative times (early
        - {date: "2026-11-27", time: "12:00", tz: America/New_York}   # closes are ~13:00-13:45 New York); confirm and
        - {date: "2026-12-24", time: "12:00", tz: America/New_York}   # extend from Windsor's holiday notices each
        - {date: "2026-12-31", time: "12:00", tz: America/New_York}   # year. Thanksgiving, Christmas, New Year, MLK,
        - {date: "2027-01-18", time: "12:00", tz: America/New_York}   # Presidents' Day, Good Friday (closed: the
        - {date: "2027-02-15", time: "12:00", tz: America/New_York}   # Thursday before is the last session)
        - {date: "2027-03-25", time: "16:30", tz: America/New_York}
      pre_news_review_min: 15        # a review call this long before a fomc/high release while a trade is open
    news_blackout:                   # B8 (D-046 a) with the gold tiers (D-049): the XAU engine fetches the public weekly
      enabled: true                  # calendar hourly into data/shared/news_calendar.json; the gate refuses entries inside
      source_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json    # a window while the file is fresh; stale ->
      refresh_minutes: 60            # no blackout + one warning (and, for this desk, no entry calls). Rollback: enabled: false
      stale_hours: 24
      currencies: [USD]
      windows:                       # minutes [before, after] the release
        fomc: [60, 75]               # FOMC statement / rate decision / press conference
        high: [30, 30]               # every other high-impact USD release (CPI, NFP, core PCE, ...)
        medium: [10, 10]             # PPI, retail sales, ISM, JOLTS, GDP when rated medium
    instruments:
      - venue: mt5
        symbol_by_profile: {demo: "XAUUSD@", live: "XAUUSD@"}
        roles: [analysis_primary, execution]
        datatypes: [candles, ticks]
        contract: {contract_size: 100, volume_min: 0.01, volume_step: 0.01, tick_size: 0.01,  # P1.5
                   stops_level_points: 25, swap_long: -37.2, swap_short: 21.15, swap_mode: points,
                   triple_swap_weekday: Wed, commission_per_lot: 0}
        start: {candles: earliest, ticks: earliest}
      - venue: binance_usdm            # real trade flow proxy for gold — used only if P1.11 approves
        symbol: XAUUSDT
        roles: [flow_context]
        datatypes: [candles, agg_trades, mark_price, funding, open_interest, metrics]
        start: {candles: "2025-12-11", agg_trades: "2025-12-11", funding: "2025-12-11", metrics: "2025-12-11"}
      # B17 intermarket context for gold: candles only (no ticks, no quotes), never a decision or gate input. The symbol
      # names are the broker's with the '@' suffix (verify after start_all: an unknown symbol logs `context_symbol_missing`
      # and the payload says cross unavailable - nothing else is affected). Rollback = delete these two entries + restart ingest.
      - venue: mt5
        symbol_by_profile: {demo: "EURUSD@", live: "EURUSD@"}     # USD proxy (~58 % of DXY, no futures roll)
        roles: [cross_context]
        datatypes: [candles]
        timeframes: [15m, 1h, 4h, 1d]
        start: {candles: "-365d"}
      - venue: mt5
        symbol_by_profile: {demo: "XAGUSD@", live: "XAGUSD@"}     # silver: confirmation of gold's moves
        roles: [cross_context]
        datatypes: [candles]
        timeframes: [15m, 1h, 4h, 1d]
        start: {candles: "-365d"}

instances:                             # D-042/D-051: this folder's one system — scripts\start_all.bat (or start.bat XAUUSD)
  XAUUSD: {api_port: 8768, magic_offset: 3}   # own data/instances/XAUUSD/app.db, logs/XAUUSD/, dashboard port, MT5 magic
                                       # (execution.magic + offset, as before the split → the same open trades are its own)

risk:                                  # D-052 (owner, 2026-10-01, the DEMO account, gold alone): the 1-oz minimum sets the
                                       # size; were D-036: 3 % / 10 % / 10x / drawdown stop 25 % / correlated 4 %
  risk_per_trade_pct: 1.0              # target; at this account the 0.01-lot (1 oz) minimum sets the size
  max_risk_per_trade_pct: 15.0         # a trade whose 1 oz risks more (a stop wider than ~15 % of equity) is refused
  max_daily_loss_pct: 30.0             # also enforced as a worst case: realised + all open SL risk + new trade
  min_rr: 1.5
  max_open_positions: 3
  max_effective_leverage: 60           # 1 oz ≈ $4,200: 39x at $107, 56x at $75 - below ~$70 equity gold is refused
  sl_atr_min_mult: 0.5
  sl_atr_max_mult: 5.0
  max_spread_to_sl_ratio: 0.2
  account_drawdown_stop_pct: 100       # off (D-052): only the daily limit stops trading (100 = equity at zero)
  max_losing_trades_per_day: 3         # D-052 (owner, 2026-10-04): no new entry after the day's 3rd losing trade
  min_confidence: 55                   # the gate executes nothing below this (was hard-coded)
  max_recommendation_age_s: 300
  max_data_staleness_s: 120
  correlated_groups: []                # D-051: gold has no sibling (kept apart from the crypto pairs)
  max_correlated_risk_pct: 30.0        # repeat trades on this pair (D-052: = the daily limit; was 4)
  allow_high_risk_display: true

execution:
  paper_equity: 100                    # paper account start (user's intended live capital, D-021)
  mode: paper                          # paper | demo | live  (D-012)
  trigger: manual                      # manual (dashboard button) | auto
  venue_by_pair: {XAUUSD: mt5}          # D-002, revisited in P7.2
  max_basis_deviation_pct: 0.15        # provisional; set from P7 measurements
  magic: 26092501
  live_confirmation: ""                # must equal the exact phrase in settings.py to allow live
  management:                          # P9.6 / D-043: the executor applies the model's declared management rules
    enabled: true
    dry_run: false                     # true = record what would be done, touch nothing (rollback switch)
    breakeven_buffer_spread_mult: 1.0  # breakeven stop = fill +/- this x spread (never closer than stops level + spread)
    min_sl_change_ticks: 5             # trailing moves smaller than this are ignored
  position_actions:                    # D-043: the model may tighten a stop, take profit, adjust a TP, cancel an order
    enabled: true                      # (never widen/remove a stop, never add size) - false = rollback switch
    max_per_decision: 4
    max_per_pair_per_day: 12
    min_minutes_between_sl_changes: 15

ai:
  active_provider: claude_code         # D-030 (override with ACTIVE_AI_PROVIDER in .env)
  fallback_provider: gemini            # used while the active provider is unavailable (not signed in / usage limit)
  agent_mode: agent_per_pair           # single_agent_global | agent_per_pair | agent_per_timeframe |
                                       # agent_per_pair_and_timeframe | agent_per_pair_with_risk_reviewer |
                                       # multi_provider_consensus
  trigger_policy: hybrid               # every_close | on_setup_event | hybrid
  output_language: en
  min_minutes_between_calls: 15        # per pair
  max_idle_minutes: 120                # hybrid: at least one review per pair every 2 h while the market is open
  max_parallel_calls: 2
  review_floor_minutes: 5              # next_review price/candle triggers: once per decision, >= this after the last call
  max_backoff_minutes: 120             # spacing doubles after each failed cycle of a pair, up to this
  cycle_deadline_s: 600                # an AI cycle is cut off after this (unfinished pairs stored as 'error')
  skip_closed_market: true             # Phase 5: no trader call while the execution market is closed and nothing is open
  skip_entry_calls_when_no_fit: true   # B12: no entry call while the minimum lot does not fit the risk/leverage caps (no desk)
  transient_retry_s: 60                # OAuth refresh race / 403 "Request not allowed": one retry after this (0 = off)
  quota_reserve_share: 0.4             # keep 40 % of daily_calls_per_pair for the busy hours below (0 = no reserve)
  quota_reserve_hours_utc: [12, 21]    # [start, end) UTC: London afternoon + New York
  daily_calls_per_pair: 40             # D-043: every attempt counts (first call, repair, escalation)
  event_calls_per_day: 6               # calls woken by a fill / close / outcome, per pair and day
  screen_timeframe: 5m                 # Python screens every 5m close; Claude only on change (new setup / condition / event)
  screen_move_atr: 0.5                 # a time-based review needs a new setup or a move > 0.5 x ATR since the last call
  weak_min: 2                          # weak setup reasons needed for a call
  weak_needs_location: true            # ... and only while price is at a 15m/1h zone or liquidity (5m = confirmation only)
  liquidity_atr: 0.3                   # "price near liquidity" = within 0.3 x ATR
  charts:                              # D-038: candle charts sent as images with the payload
    enabled: true                      # false = text-only calls (rollback switch)
    width: 720
    height: 400
    timeframes: [1w, 1d, 4h, 1h, 15m, 5m]
    bars: {1w: 60, 1d: 120, 4h: 120, 1h: 120, 15m: 96, 5m: 96}
    overlays: [levels, zones, liquidity, structure, holdings, ema]
  models:                              # D-043: per role, changeable any time (config.local.yaml); model = sonnet | opus |
    decision: {model: null, effort: null}      # fable | a full name; null = providers.claude_code.model / effort
    escalation: {model: opus, effort: high}    # confirms/downgrades strong setups when escalation.enabled
    review: {model: opus, effort: high}        # Phase 4 daily/weekly review sessions
    monitor: {model: sonnet, effort: low}      # Phase 4 diagnosis runs
    scalp: {model: claude-fable-5-1, effort: medium}   # D-058: the manual-scalping brief (the owner chose Fable 5.1)
  escalation:
    enabled: false                     # true = a strong BUY/SELL is confirmed by models.escalation before execution
    on_strength: [strong]
    min_confidence: 60
    max_per_day_per_pair: 6
    on_failure: withhold               # withhold | keep
    timeout_s: 150
  usage:                               # Phase 4 usage gauge: rolling token sums of every Claude call (ledger)
    weekly_token_budget: 12000000      # calibration guesses until a week of data exists (H21)
    five_hour_token_budget: 1500000
    cache_read_weight: 0.1             # a cached input token counts this much
    level1_pct: 70                     # >= : reviews and events only
    level2_pct: 90                     # >= : events only
    enforce: false                     # false = published only (status, health report, review pack), never rations
  consensus_providers: []
  budget:                              # D-004 Cost Governor
    daily_usd_cap: 0.0                 # 0 = paid providers blocked (free tier only for now)
    monthly_usd_cap: 0.0
    max_ai_cost_to_profit_ratio: 0.2
    rolling_window_days: 30
    min_trades_for_ratio: 20
  # Model ids and prices are re-verified against official docs in P8.2 before any paid use.
  providers:
    claude_code:                       # D-030: Claude on your own Claude subscription via the Claude Code CLI -
      kind: claude_code                # no API key, no per-token bill; shares the plan's 5-hour/weekly limits
      model: claude-sonnet-5           # D-053 (owner, 2026-10-06): pinned - P12.7 (Sonnet 5.5 / Opus 5.5 / Fable 5.1 on the
                                       # same inputs all did worse with this desk); the "sonnet" alias may move to 5.5
      model_env: CLAUDE_CODE_MODEL
      api_key_env: CLAUDE_CODE_OAUTH_TOKEN   # optional long-lived token (`claude setup-token`); empty = CLI login
      effort: medium
      free_tier: true                  # flat subscription: no marginal USD cost per call
      structured_output: prompt        # schema in the prompt, one turn (--json-schema costs ~4-5x: D-035)
      max_concurrency: 2               # two pairs analysed at once (set 1 on 4 GB machines)
      rpm: 4
      rpd: 300                         # daily cap (D-056: XAUUSD up to 250 a day with the 5-min looks while holding; was 160)
      timeout_s: 180                  # serialized calls: keep a 3-pair batch within risk.max_recommendation_age_s
    gemini:
      kind: gemini
      model: gemini-3.8-flash
      model_env: GEMINI_MODEL
      fallback_model: gemini-3.5-flash-lite
      api_key_env: GOOGLE_API_KEY
      free_tier: true                  # set false if you move to the paid tier - prices below then apply
      rpm: 5                           # set from your AI Studio rate-limit page (H4)
      rpd: 100
      quota_reset_tz: America/Los_Angeles  # Google resets the daily quota at midnight Pacific time
      effort: low                      # thinking level (low | medium | high)
      max_output_tokens: 16384         # thinking tokens count against this budget
      timeout_s: 90
      model_prices:                    # paid-tier USD/MTok (ai.google.dev/gemini-api/docs/pricing, 2026-09)
        gemini-3.8-flash: [1.50, 7.50] # upper bound of the published 3.x Flash range (conservative)
        gemini-3.5-flash-lite: [0.30, 2.50]
    anthropic:
      kind: anthropic
      model: claude-opus-5
      model_env: ANTHROPIC_MODEL
      fallback_model: claude-sonnet-5
      api_key_env: ANTHROPIC_API_KEY
      effort: high
      max_output_tokens: 16000
      model_prices:                    # Anthropic first-party USD/MTok
        claude-opus-5: [5.00, 25.00]
        claude-opus-5-5: [4.00, 20.00]
        claude-sonnet-5: [2.00, 10.00]
        claude-haiku-4-5: [1.00, 5.00]
    openai:
      kind: openai
      model: gpt-5
      model_env: OPENAI_MODEL
      api_key_env: OPENAI_API_KEY
      structured_output: native        # prices must be filled in before paid use (unknown cost -> blocked)
    grok:
      kind: openai_compat
      model: grok-4
      model_env: GROK_MODEL
      api_key_env: XAI_API_KEY
      base_url: https://api.x.ai/v1
      structured_output: native
    groq:
      kind: openai_compat
      model: llama-3.3-70b-versatile
      model_env: GROQ_MODEL
      api_key_env: GROQ_API_KEY
      base_url: https://api.groq.com/openai/v1
      structured_output: json_object
      free_tier: true
    openrouter:
      kind: openai_compat
      model: deepseek/deepseek-chat-v3.1:free
      model_env: OPENROUTER_MODEL
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
      structured_output: prompt
      free_tier: true
    deepseek:
      kind: openai_compat
      model: deepseek-chat
      model_env: DEEPSEEK_MODEL
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com/v1
      structured_output: json_object
    ollama:                            # local fallback; weak on 4 GB RAM machines (connectivity fallback only)
      kind: openai_compat
      model: qwen2.5:3b
      model_env: OLLAMA_MODEL
      base_url: http://127.0.0.1:11434/v1
      structured_output: json_object
      free_tier: true

api:
  host: 127.0.0.1
  port: 8765
  token_env: DASHBOARD_TOKEN

adaptive:                              # Phase 4 (D-039): bounded per-pair overlay in data/adaptive/<PAIR>/ (tools/tune.py)
  enabled: true                        # false = defaults everywhere, tune.py refuses every change
  max_expiry_days: 14
  cooldown_days: 7                     # per key
  max_changes_per_day: 1               # per pair
  min_samples_strategy: 20             # resolved virtual outcomes in the window
  min_samples_activity: 10
  unhealthy_freeze_pct: 25             # no tuning when more of the window than this was unhealthy

notify:                                # Phase 4 (D-043): log line + Windows toast + Telegram (H18: .env TELEGRAM_*)
  enabled: true
  toast: true
  telegram: true                       # used only when TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set
  min_level: info                      # info | warn | critical
  rate_per_hour: 20                    # per process, for info and for warn each (critical: no limit)
  dedupe_minutes: 30

monitor:                               # Phase 4: tools/monitor.py every 15 min (Task Scheduler, H19), no Claude
  stale_heartbeat_min: 15
  order_burst_per_hour: 3              # more orders of one pair in an hour → that pair's KILL_SWITCH
  equity_drop_warn_pct: 15             # between two runs (D-052: one gold loss may take 15 %; was 5)
  equity_drop_kill_pct: 35             # … → the global KILL_SWITCH (D-052: above two full losses; was 10)
  daily_loss_warn_margin_pct: 5        # warn at -(risk.max_daily_loss_pct - this) = -25 % (D-052)
  free_ram_warn_mb: 300
  snapshot_build_warn_ms: 3000         # engine payload build time (5-min screening)
  vpn_adapter_names: []                # e.g. ["Local Area Connection 4"] (ExpressVPN TUN)
  diagnose_enabled: true               # a warning starts a Claude diagnosis session (at most every 3 h) …
  diagnose_max_per_day: 2              # … and at most this many per UTC day (shared Max plan)
  diagnose_max_gauge_level: 0          # … and none while the usage gauge is above this level
  battery_warn_pct: 30                 # on battery below this → warn; below battery_critical_pct → critical
  battery_critical_pct: 15
  on_battery_warn_min: 5               # on battery longer than this → warn (the charger is out)
  commit_warn_pct: 85                  # committed memory above this share of the commit limit → warn
  recorder_stall_min: 30               # the P1.12 price recorder's last flush older than this → warn (0 = off)
  daily_report_utc: "00:30"            # D-059: yesterday's live report (tools\live_report.py --telegram: the file +
                                       # its summary on Telegram / toast) from the first monitor run after this (UTC); "" = off

operator:                              # Phase 4: Claude review sessions from Task Scheduler (tools/operator, H19)
  daily_max_turns: 30
  weekly_max_turns: 40
  diagnose_max_turns: 12
  daily_utc: "04:30"                 # D-051: the review tasks' times (UTC) - spaced from the other pairs' folders
  weekly_utc: "06:00"                # so two Claude sessions never run at once on this laptop
  weekly_day: Sunday

backup:                                # Phase 5 A2: tools/backup_state.py (daily task + restart_all.bat); never .env
  enabled: true
  dir: backups                         # relative to the project root (git-ignored) or an absolute path
  keep: 14
  daily_utc: "03:30"                 # D-051: the backup task's time (UTC)

evaluation:                            # the demo evaluation window (D-046/D-047): tools/demo_report.py, go_live_inputs.py
  demo_start_utc: "2026-09-27T21:50:00Z"   # the Phase 4 restart (H20)
  demo_days: 5

scalp:                                 # D-058 (owner, 2026-10-12): the manual-scalping brief - SEPARATE from the desk
  enabled: false                       # tools\scalp_brief.py (+ scripts\start_scalp.bat); the dashboard's Scalp tab
  pair: XAUUSD                         # never places an order; its calls (role scalp, no pair) are outside the desk's caps
  hours_utc: [7, 16]                   # the DEFAULT window [start, end) UTC (London + New York); the owner sets the hours and the
                                       # cadence (every 15/20/30/60/120 min) on the Scalp tab (D-062); the button runs any time
  run_offset_s: 20                     # seconds after the full hour (the closed 5m bar must be stored first)
  max_per_day: 12                      # model calls (ledger rows: a repair counts) per UTC day, hourly + on demand (~0.2 % of the weekly meter each on Fable)
  charts: [1h, 15m, 5m]                # its own chart images (data\scalp\charts), not the desk's six
  min_free_ram_mb: 700                 # a run waits (then skips) below this free RAM; this laptop sits at 230-650 MB free with
                                       # the desktop app + browsers open, so config.local lowers it (2026-10-12)
  output_language: ar                  # the prose of the brief (technical terms stay English)
  journal_n: 6                         # scored briefs the model sees (its journal); stats_n briefs behind the hit-rate
  stats_n: 20
  trigger_window_min: 60               # scoring: a plan may trigger this long after the brief ...
  level_horizon_min: 60                # ... a level is scored over this window ...
  hold_window_min: 30                  # ... held / broken decided within this long after the first touch
  gate_retry_min: 20                   # a run waits this long for the desk's call / free RAM, then skips the hour
  run_timeout_s: 600                   # the run itself, after its gates; the loop kills a child only after gate_retry_min + this
  manual_lookback_days: 7              # the owner's manual deals (magic 0) read from the running MT5 terminal; 0 = never
  # D-061 (2026-10-12): auto execution of THE trade - the owner switches mode (analyze | auto), the fixed lot and the
  # confidence floor on the Scalp tab (data\scalp\settings.json, no restart); the bounds and facts live here
  auto_magic_offset: 9                 # the scalp trades' magic = execution.magic base + 9 (the desk counts them as siblings)
  auto_default_lot: 0.01
  auto_max_lot: 0.10                   # the dashboard refuses a bigger lot
  auto_min_confidence: 55              # the default floor: a plan under it is analysed, never placed
  auto_risk_cap_pct: 5.0               # |entry - stop| x lot x contract_size must stay under this % of equity
  contract_size: 100                   # XAUUSD: 100 oz per lot
  notify: true                         # core/notify: toast + Telegram (TELEGRAM_* in .env, docs/notifications.md H18)
  notify_level: info
  manual_risk_cap_pct: 5.0             # the recommendation shown on the page; the owner's risk numbers stay the owner's
